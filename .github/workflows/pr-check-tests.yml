name: 'PR Test Coverage Check'

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-tests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            src:
              - 'src/**/*.ts'
              - 'src/**/*.tsx'
            tests:
              - 'src/**/*.test.ts'
              - 'src/**/*.test.tsx'

      - name: Comment if tests missing
        if: steps.changed.outputs.src_any_changed == 'true' && steps.changed.outputs.tests_any_changed == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            This PR appears to be missing tests. Please add tests per CONTRIBUTING.md before merging.
          edit-mode: replace
